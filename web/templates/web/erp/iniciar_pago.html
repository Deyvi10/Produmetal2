{% extends 'web/base.html' %}

{% block content %}
<style>
    body { background-color: var(--pm-bg); color: var(--pm-text); }
    .erp-container { max-width: 600px; padding-bottom: 60px; margin-top: 60px; }
    .card-master { background: var(--pm-surface); border: 1px solid var(--pm-border); border-radius: 12px; box-shadow: var(--pm-shadow); padding: 2rem; }
    .btn-primary-custom { background: #0d6efd; color: #fff; font-weight: bold; border-radius: 8px; padding: 12px 24px; border: none; }
    .btn-primary-custom:hover { filter: brightness(0.9); color: #fff; }
    label, .form-label { color: var(--pm-text); }
    .form-control { background-color: var(--pm-bg); border: 1px solid var(--pm-border); color: var(--pm-text); }
    .form-control:focus { background-color: var(--pm-bg); color: var(--pm-text); border-color: var(--pm-amber); box-shadow: 0 0 0 3px var(--pm-amber-soft); }
    .btn-outline-secondary { color: var(--pm-text); border-color: var(--pm-border); }
</style>

<div class="container erp-container">
    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="{% url 'ficha_trabajador' trabajador.id %}" class="btn btn-outline-secondary rounded-pill px-3"><i class="bi bi-arrow-left"></i></a>
        <h2 class="fw-bold mb-0">Registrar Pago — {{ trabajador.nombre_completo }}</h2>
    </div>

    <form method="GET" action="{% url 'preparar_pago' trabajador.id %}" class="card-master">
        <p class="small" style="color: var(--pm-text-muted);">Elige el rango de fechas del periodo. El sistema generará automáticamente cada día del rango, indicando si es normal según el horario del trabajador o si ya fue pagado.</p>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label fw-bold">Periodo desde</label>
                <input type="date" name="periodo_inicio" class="form-control" value="{{ hoy|date:'Y-m-d' }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Periodo hasta</label>
                <input type="date" name="periodo_fin" class="form-control" value="{{ hoy|date:'Y-m-d' }}" required>
            </div>
        </div>
        <div class="d-flex justify-content-end mt-4">
            <button type="submit" class="btn-primary-custom px-4"><i class="bi bi-calendar-check me-2"></i> Generar Días del Periodo</button>
        </div>
    </form>
</div>
{% endblock %}
